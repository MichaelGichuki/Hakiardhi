      - ./organizations/peerOrganizations/verificationofficer.hakiardhi.local/peers/peer0.verificationofficer.hakiardhi.local/tls:/etc/hyperledger/fabric/tls
      - peer0.verificationofficer.hakiardhi.local:/var/hyperledger/production
